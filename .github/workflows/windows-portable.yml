name: Windows EXE Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - "pyapp/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/windows-portable.yml"

jobs:
  build:
    runs-on: windows-latest

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
          refreshenv

          $ffmpeg = (Get-Command ffmpeg).Source
          $ffprobe = (Get-Command ffprobe).Source

          "FFMPEG_PATH=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FFPROBE_PATH=$ffprobe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "ffmpeg: $ffmpeg"
          Write-Host "ffprobe: $ffprobe"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Build one-file exe
        # Build output: dist/Video Grid Compositor.exe
        run: python scripts/build_portable.py --onefile --distpath dist --workpath build/windows

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-grid-compositor-windows-exe
          path: dist/Video Grid Compositor.exe
          if-no-files-found: error
