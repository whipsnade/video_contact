[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-grid-compositor"
version = "0.2.0"
description = "Portable desktop app for width-based media slicing and grid recomposition"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.11,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9",
  "pytest-qt>=4.5",
  "pyinstaller>=6.19",
]

[project.scripts]
video-grid-compositor = "pyapp.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyapp*"]
